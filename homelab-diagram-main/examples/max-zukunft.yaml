# BEISPIELDATEN – kein echter Stand. Ein möglicher Ausbau nach Max' Angaben (Mini-Rack, redundante
# Firewall + Switches, Workload-/KI-/Lab-/Management-Server, 2 gespiegelte NAS + Backup-NAS, Pis,
# KVM-Switch, Desktop-Switch, IoT). IPs nach der Idee 10.x = Kern, 172.16.x = Lab/KI, 192.168.x = Alltag.
# Dient als Test, dass die Engine viele Geräte und Verbindungen sauber zeichnet.
schema: 2
meta:
  title: "Homelab · Zukunftsplan"
  title_redacted: "Homelab · Zukunftsplan"
  date: "Beispiel · November 2026"
  watermark: "Neun Welten"
  domain: "example.org"
redact: {domain: true, domain_placeholder: "redacted.org", ssid_names: true}

networks:
  - {key: "10",  name: MGMT,    subnet: "10.10.10.0/24",    color: "#e3b341", note: "Kern · Verwaltung, nur Admin-Laptop + VPN"}
  - {key: "20",  name: SERVER,  subnet: "10.10.20.0/24",    color: "#58a6ff", note: "Kern · interne Dienste"}
  - {key: "30",  name: DMZ,     subnet: "10.10.30.0/24",    color: "#f0883e", note: "von außen erreichbar · nichts nach innen"}
  - {key: "70",  name: STORAGE, subnet: "10.10.70.0/24",    color: "#a5d6ff", note: "Kern · NFS/SMB, Replikation, kein Internet"}
  - {key: "100", name: CLUSTER, subnet: "10.10.100.0/24",   color: "#d2a8ff", note: "Kern · Corosync + Quorum, kein Gateway"}
  - {key: "80",  name: LAB,     subnet: "172.16.80.0/24",   color: "#ff7eb6", note: "dazwischen · darf kaputtgehen"}
  - {key: "90",  name: AI,      subnet: "172.16.90.0/24",   color: "#7ee787", note: "dazwischen · KI, nur definierte APIs"}
  - {key: "40",  name: TRUSTED, subnet: "192.168.40.0/24",  color: "#39c5cf", note: "Alltag · Laptop, Desktop, Handy"}
  - {key: "50",  name: IOT,     subnet: "192.168.50.0/24",  color: "#3fb950", note: "Alltag · Smart Home, Drucker, Luftreiniger"}
  - {key: "60",  name: GUEST,   subnet: "192.168.60.0/24",  color: "#bc8cff", note: "Gäste · nur Internet"}
  - {key: "vpn", tag: WireGuard, name: VPN, subnet: "100.64.10.0/24", color: "#56d4dd", note: "Tunnel · Handy, Laptop, VPS"}
  - {key: "wan", tag: Modem, name: WAN, subnet: "192.168.100.0/24", color: "#f85149", note: "Übergabe vom Provider-Modem"}

internet: {label: "Internet", sub: "DS-Lite? · noch offen", speed: {down: "250 Mbit/s", up: "40 Mbit/s"}}
remote:
  - {name: "Fernzugriff", note: "Handy + Laptop · WireGuard", icon: wireguard, net: vpn}
cloud:
